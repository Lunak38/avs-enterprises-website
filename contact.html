    <nav>
      <a href="index.html">Home</a>
      <a href="services.html">Services</a>
      <a href="about.html">About</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>

<!-- CONTACT HERO -->
<section class="services-hero">
  <div class="container">
    <h2>Contact Us</h2>
    <p>
      Let’s discuss your project requirements and how we can help.
    </p>
  </div>
</section>

<!-- CONTACT FORM -->
<section class="services">
  <div class="container">

    <div class="service-card">
      <p>
        If you would like to discuss a project or need our BIM and civil
        engineering services, please fill out the form below.
      </p>

      <form action="https://formsubmit.co/kunalsingh.omegaxl03@gmail.com" method="POST">

        <!-- Disable captcha -->
        <input type="hidden" name="_captcha" value="false">

        <!-- Redirect after successful submit -->
        <input type="hidden" name="_next" value="thankyou.html">

        <div style="margin-bottom: 15px;">
          <label>Name</label><br>
          <input type="text" name="name" required style="width:100%; padding:10px;">
        </div>

        <div style="margin-bottom: 15px;">
          <label>Email</label><br>
          <input type="email" name="email" required style="width:100%; padding:10px;">
        </div>

        <div style="margin-bottom: 15px;">
          <label>Message</label><br>
          <textarea name="message" rows="5" required style="width:100%; padding:10px;"></textarea>
        </div>

        <button class="btn">Send Message</button>
      </form>
    </div>

  </div>
</section>
